[build]
  # Install the Playwright Chromium browser before building so
  # scripts/generate-pdf.mjs can render the resume PDF. The browser download
  # lands in ~/.cache/ms-playwright, which Netlify persists between builds.
  command = "npx playwright install chromium && npm run build"
  publish = "dist"

[build.environment]
  # @google/genai requires Node >= 20.
  NODE_VERSION = "20"
